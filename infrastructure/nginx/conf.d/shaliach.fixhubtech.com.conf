# ═══════════════════════════════════════════════════════════════
# SHALIACH AI — Nginx Reverse Proxy Configuration
# Subdomain: shaliach.fixhubtech.com & api.shaliach.fixhubtech.com
# (Completely isolated from main fixhubtech.com website)
# ═══════════════════════════════════════════════════════════════

# HTTP -> HTTPS Redirect
server {
    listen 80;
    server_name api.shaliach.fixhubtech.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Backend API Server
server {
    listen 443 ssl http2;
    server_name api.shaliach.fixhubtech.com;

    # SSL Certificates from Let's Encrypt / Certbot
    ssl_certificate /etc/letsencrypt/live/api.shaliach.fixhubtech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.shaliach.fixhubtech.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Max upload body size for CSV streaming (50MB)
    client_max_body_size 50M;

    location / {
        limit_req zone=api_limit burst=50 nodelay;

        # Instant preflight response with full CORS headers
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $http_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,Cookie' always;
            add_header 'Access-Control-Max-Age' 86400 always;
            add_header 'Content-Type' 'text/plain; charset=utf-8' always;
            add_header 'Content-Length' 0 always;
            return 204;
        }

        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
